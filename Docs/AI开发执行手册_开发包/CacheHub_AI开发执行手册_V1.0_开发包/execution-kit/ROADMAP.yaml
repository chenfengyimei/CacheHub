schema_version: 1
project: CacheHub
rule: '功能不删除，只按独立模块和阶段门延后'
phases:
  - id: P00
    name: "协议冻结、研究与仓库初始化"
    goal: "建立最小可运行工程骨架，冻结核心术语、Schema、状态文件和开发治理规则。"
    dependencies:
      []
    exit_gate: "空仓库可构建、测试、打包；Context Package/错误/能力发现 Schema 有版本；AI 状态文件能驱动后续阶段。"
    work_items:
      - id: P00-W001
        name: "创建仓库治理文件"
        description: "建立 README、LICENSE 占位、NOTICE、THIRD_PARTY_NOTICES、CONTRIBUTING、SECURITY、CODE_OF_CONDUCT、.editorconfig、.gitignore。"
        status: planned
      - id: P00-W002
        name: "创建最小解决方案"
        description: "创建 CacheHub.Core、CacheHub.Storage、CacheHub.Indexing、CacheHub.Context、CacheHub.Cli、CacheHub.Tests；禁止提前创建所有长期程序集。"
        status: planned
      - id: P00-W003
        name: "固定 SDK 与构建属性"
        description: "使用 global.json 固定 SDK；Directory.Build.props 统一可空引用、警告级别、分析器、确定性构建和语言版本。"
        status: planned
      - id: P00-W004
        name: "建立错误与结果模型"
        description: "实现稳定 ErrorCode、CacheHubException、Result<T> 或等价模式；CLI/API 错误不得依赖异常字符串。"
        status: planned
      - id: P00-W005
        name: "定义强类型标识符"
        description: "WorkspaceId、FileId、IndexSnapshotId、ContextPackageId、JobId 等不可混用。"
        status: planned
      - id: P00-W006
        name: "冻结 Context Package v1 草案"
        description: "Manifest 与 Payload 分离；定义必填字段、版本字段、哈希算法和兼容规则。"
        status: planned
      - id: P00-W007
        name: "冻结 Capability Discovery v1"
        description: "定义 CLI 与 Local API 统一能力返回结构。"
        status: planned
      - id: P00-W008
        name: "建立 AI 开发状态机制"
        description: "创建 docs/ai/AI_DEV_STATE.json、ROADMAP_STATUS.md、ADR、风险登记和任务日志模板。"
        status: planned
      - id: P00-W009
        name: "建立基础 CI"
        description: "至少执行 restore、build、test、format check；不发布制品。"
        status: planned
      - id: P00-W010
        name: "完成许可证研究台账"
        description: "记录计划研究的开源项目、许可证和“只学习/复制代码”状态。"
        status: planned
  - id: P01
    name: "Workspace 与存储基础"
    goal: "实现本地工作区注册、SQLite 迁移、路径安全和原子快照基础。"
    dependencies:
      - P00
    exit_gate: "可导入本地目录为工作区，数据库可迁移/回滚，路径逃逸和大小写策略有测试。"
    work_items:
      - id: P01-W001
        name: "实现应用数据目录"
        description: "区分配置、索引、缓存、日志、临时文件；不得写入用户源码目录。"
        status: planned
      - id: P01-W002
        name: "实现 SQLite 连接与迁移"
        description: "WAL、busy timeout、事务、schema version；迁移失败保留旧库。"
        status: planned
      - id: P01-W003
        name: "实现 Workspace 聚合"
        description: "名称、根路径指纹、仓库、组件、状态、安全策略引用。"
        status: planned
      - id: P01-W004
        name: "实现路径规范化服务"
        description: "绝对路径、分隔符、大小写、UNC、符号链接、路径穿越检查。"
        status: planned
      - id: P01-W005
        name: "实现工作区注册 CLI"
        description: "workspace import/status/list/remove；remove 默认只删除 CacheHub 数据。"
        status: planned
      - id: P01-W006
        name: "实现数据库仓储边界"
        description: "业务层不写 SQL；避免建立过度通用 Repository<T>。"
        status: planned
      - id: P01-W007
        name: "实现索引快照表"
        description: "新快照先写临时状态，成功后原子设为 active。"
        status: planned
      - id: P01-W008
        name: "实现后台任务模型"
        description: "Queued/Running/WaitingForApproval/Completed/Failed/Cancelled。"
        status: planned
      - id: P01-W009
        name: "实现结构化日志脱敏"
        description: "路径可配置脱敏；禁止记录凭据、Authorization、完整敏感源码。"
        status: planned
  - id: P02
    name: "Indexer 0.1-alpha"
    goal: "实现确定、可恢复、可增量的文件索引，不依赖模型和 GUI。"
    dependencies:
      - P01
    exit_gate: "10,000 文件工作区可扫描；文件变化只更新必要记录；监听丢失可通过对账恢复。"
    work_items:
      - id: P02-W001
        name: "实现目录枚举器"
        description: "流式枚举；限制深度/文件数；处理无权限、循环链接、长路径。"
        status: planned
      - id: P02-W002
        name: "实现忽略规则"
        description: "合并默认规则、.gitignore、.cachehubignore、用户规则；记录 ignore_rules_hash。"
        status: planned
      - id: P02-W003
        name: "实现文件类型与二进制检测"
        description: "扩展名+内容采样；跳过二进制和超限文件。"
        status: planned
      - id: P02-W004
        name: "实现分层哈希"
        description: "小文件完整 SHA-256；大文件快速指纹+按需完整哈希。"
        status: planned
      - id: P02-W005
        name: "实现文件状态机"
        description: "Discovered/Indexed/Ignored/Failed/Deleted/Stale。"
        status: planned
      - id: P02-W006
        name: "实现 FTS5 索引"
        description: "已入库文本的稳定召回；绑定 IndexSnapshotId。"
        status: planned
      - id: P02-W007
        name: "封装 ripgrep"
        description: "仅用于实时磁盘搜索、正则、未索引/降级；结果标记来源。"
        status: planned
      - id: P02-W008
        name: "实现文件监听入队"
        description: "事件去抖、合并、溢出检测；监听不作为最终事实。"
        status: planned
      - id: P02-W009
        name: "实现启动/周期一致性对账"
        description: "比较路径、大小、时间和哈希；分支切换后强制校验。"
        status: planned
      - id: P02-W010
        name: "实现索引 CLI"
        description: "index build/refresh/status/verify。"
        status: planned
      - id: P02-W011
        name: "实现故障恢复"
        description: "单文件失败不终止；任务取消后可恢复；旧快照继续可读。"
        status: planned
      - id: P02-W012
        name: "建立性能基准"
        description: "1k/10k/100k 文件、大小文件混合、事件风暴。"
        status: planned
  - id: P03
    name: "确定性代码结构"
    goal: "使用通用文本与 Tree-sitter 提取结构，不把启发式关系冒充精确语义。"
    dependencies:
      - P02
    exit_gate: "C#、TypeScript、Python 可提取 Outline；解析失败自动降级；关系带类型和置信度。"
    work_items:
      - id: P03-W001
        name: "定义 Parser 接口"
        description: "输入文件快照，输出符号、导入、调用表达式、诊断和 Parser 版本。"
        status: planned
      - id: P03-W002
        name: "实现通用文本解析器"
        description: "标题、注释、配置键、Markdown 章节、代码块边界。"
        status: planned
      - id: P03-W003
        name: "接入 Tree-sitter 运行时"
        description: "明确原生库打包策略和平台矩阵。"
        status: planned
      - id: P03-W004
        name: "实现 C# 语法提取"
        description: "namespace/type/method/property/import；只标记 syntactic。"
        status: planned
      - id: P03-W005
        name: "实现 TypeScript 语法提取"
        description: "module/import/export/class/function/interface/call expression。"
        status: planned
      - id: P03-W006
        name: "实现 Python 语法提取"
        description: "module/import/class/function/decorator/call expression。"
        status: planned
      - id: P03-W007
        name: "定义关系置信度"
        description: "syntactic/heuristic/semantic；confidence 0..1；source parser。"
        status: planned
      - id: P03-W008
        name: "实现 Deterministic Outline"
        description: "输出稳定排序、行范围、公共符号和导入。"
        status: planned
      - id: P03-W009
        name: "实现基础 Repo Map"
        description: "按组件、目录、符号重要度压缩；严格受预算限制。"
        status: planned
      - id: P03-W010
        name: "实现 Parser Cache"
        description: "文件哈希+ParserId+ParserVersion+GrammarVersion。"
        status: planned
      - id: P03-W011
        name: "建立语法夹具测试"
        description: "完整、错误、生成、超大、Unicode、混合换行文件。"
        status: planned
  - id: P04
    name: "Context Package 与 Context Engine 0.1"
    goal: "生成版本感知、可解释、可复现且严格受预算约束的最小上下文包。"
    dependencies:
      - P03
    exit_gate: "相同输入/快照/策略得到稳定结果；Manifest 可验证；Payload 可导出；不超过硬限制。"
    work_items:
      - id: P04-W001
        name: "实现任务解析器"
        description: "显式路径、符号、错误堆栈、关键词、操作类型；第一版不调用 LLM。"
        status: planned
      - id: P04-W002
        name: "实现候选召回管线"
        description: "路径、文件名、FTS、符号、Repo Map、Git Diff、最近修改、测试/配置关系。"
        status: planned
      - id: P04-W003
        name: "定义特征归一化"
        description: "每项特征 0..1；缺失值处理；避免大文件/高频词偏置。"
        status: planned
      - id: P04-W004
        name: "实现版本化 Ranking Profile"
        description: "配置文件可调；profile id/version 写入 Context Package。"
        status: planned
      - id: P04-W005
        name: "实现候选去重和聚合"
        description: "文件级与区块级分数；同一符号多个来源合并原因。"
        status: planned
      - id: P04-W006
        name: "实现 Chunking Strategy v1"
        description: "语法块优先、行窗口回退、重叠控制、包装开销计入。"
        status: planned
      - id: P04-W007
        name: "实现 Token 预算器"
        description: "模型窗口、Agent/响应保留、目标、硬限制、安全余量。"
        status: planned
      - id: P04-W008
        name: "实现选择模式"
        description: "Full/Chunks/Outline/DeterministicSummary/Metadata。"
        status: planned
      - id: P04-W009
        name: "实现 Manifest"
        description: "记录版本、策略、文件哈希、范围、原因、排除候选和安全信息。"
        status: planned
      - id: P04-W010
        name: "实现 Payload"
        description: "Markdown/JSON/plain text；内容与 Manifest 分离。"
        status: planned
      - id: P04-W011
        name: "实现 Context Expand"
        description: "按文件/符号/查询扩展；记录 parent package 和增量 Token。"
        status: planned
      - id: P04-W012
        name: "实现 Context Explain"
        description: "解释选择、分数构成、预算淘汰、潜在遗漏。"
        status: planned
      - id: P04-W013
        name: "实现 Context Cache"
        description: "严格绑定任务、快照、策略、预算、安全策略和版本。"
        status: planned
      - id: P04-W014
        name: "实现 Schema 验证与兼容测试"
        description: "旧 minor 版本可读；未知字段保留/忽略规则明确。"
        status: planned
  - id: P05
    name: "公共 CLI、Local API 与 Integration Kit"
    goal: "让任何能执行命令、调用 HTTP 或读取文件的客户端主动接入 CacheHub。"
    dependencies:
      - P04
    exit_gate: "无需 Agent 专用插件即可完成能力发现、工作区定位、上下文构建、扩展和反馈。"
    work_items:
      - id: P05-W001
        name: "稳定 CLI JSON 契约"
        description: "所有命令支持 --output json；stdout 只输出协议结果，日志走 stderr。"
        status: planned
      - id: P05-W002
        name: "实现 capability discovery"
        description: "版本、模块、Schema、命令、API、Gateway 和限制。"
        status: planned
      - id: P05-W003
        name: "实现工作区推断"
        description: "显式 ID > 当前路径 > 唯一匹配；禁止以最近工作区静默猜测。"
        status: planned
      - id: P05-W004
        name: "实现 Local API"
        description: "只监听 loopback；token 认证；与 CLI 共享应用服务。"
        status: planned
      - id: P05-W005
        name: "实现文件导出"
        description: "Manifest/Payload/RepoMap；默认写 CacheHub 数据目录。"
        status: planned
      - id: P05-W006
        name: "编写 Universal Skill"
        description: "Agent 无关；仓库内容视为不可信；优先 context build。"
        status: planned
      - id: P05-W007
        name: "编写自动接入教程"
        description: "CLI、HTTP、文件、Gateway 四种接入等级。"
        status: planned
      - id: P05-W008
        name: "实现 integration verify"
        description: "检查安装、权限、工作区、Context Build、回滚能力。"
        status: planned
      - id: P05-W009
        name: "提供配置备份/回滚脚本"
        description: "修改第三方配置前备份；失败自动恢复。"
        status: planned
      - id: P05-W010
        name: "提供示例而非核心适配"
        description: "Codex/Claude/Cursor/Cline 仅文档和模板。"
        status: planned
      - id: P05-W011
        name: "实现 Feedback 协议"
        description: "实际读取、追加文件、补丁、测试和遗漏报告。"
        status: planned
  - id: P06
    name: "核心 Benchmark 与阶段门"
    goal: "用多客户端、真实任务和受控重复实验验证上下文质量与全生命周期 Token 收益。"
    dependencies:
      - P05
    exit_gate: "至少 20 个任务有 Ground Truth 和多次运行；阶段门结果可复现，失败可归因。"
    work_items:
      - id: P06-W001
        name: "建立任务仓库与固定快照"
        description: "至少 C#、TypeScript、Python、Unity、Monorepo、陌生仓库。"
        status: planned
      - id: P06-W002
        name: "定义 Ground Truth"
        description: "Required/Helpful/Distractor；双人或复核标注。"
        status: planned
      - id: P06-W003
        name: "建立 Baseline Runner"
        description: "固定模型、Agent、工具权限、系统提示、仓库状态。"
        status: planned
      - id: P06-W004
        name: "建立 CacheHub Runner"
        description: "强制记录 Context Package、expand 和额外读取。"
        status: planned
      - id: P06-W005
        name: "实现环境重置"
        description: "每次运行从同一 Commit/Dirty State/构建缓存策略开始。"
        status: planned
      - id: P06-W006
        name: "处理模型随机性"
        description: "每任务多次运行；记录均值、方差、最差结果。"
        status: planned
      - id: P06-W007
        name: "实现指标计算"
        description: "File/Symbol Recall@K、Precision、总 Token、成功率、轮数、遗漏/陈旧率。"
        status: planned
      - id: P06-W008
        name: "实现失败归因"
        description: "检索、排序、预算、Agent不遵守、模型随机、环境失败。"
        status: planned
      - id: P06-W009
        name: "生成公开报告"
        description: "原始结果、配置、版本、限制、置信区间。"
        status: planned
      - id: P06-W010
        name: "执行阶段门"
        description: "未达标只迭代核心，不删除后续功能，也不提前扩大产品表面。"
        status: planned
  - id: P07
    name: "最小 GUI 0.1-beta"
    goal: "让技术用户无需读 JSON 即可管理工作区、索引和 Context Package。"
    dependencies:
      - P06
    exit_gate: "GUI 不直接访问数据库；能导入本地目录、查看索引、构建并解释上下文。"
    work_items:
      - id: P07-W001
        name: "确定 UI 宿主"
        description: "Avalonia 或最小本地 Web；做 ADR，避免双 UI。"
        status: planned
      - id: P07-W002
        name: "实现应用服务客户端"
        description: "GUI 只调用 Core/Local API；支持取消和进度。"
        status: planned
      - id: P07-W003
        name: "工作区列表与导入"
        description: "本地目录、状态、错误和最近使用。"
        status: planned
      - id: P07-W004
        name: "索引任务页"
        description: "阶段、文件数、失败文件、取消、重试和 verify。"
        status: planned
      - id: P07-W005
        name: "Context Build 页"
        description: "任务、预算、策略、选中文件和范围。"
        status: planned
      - id: P07-W006
        name: "Context Explain 页"
        description: "分数、原因、排除、安全扫描、版本。"
        status: planned
      - id: P07-W007
        name: "Integration 状态页"
        description: "能力、教程、verify，不实现 Agent 私有逻辑。"
        status: planned
      - id: P07-W008
        name: "设置与日志"
        description: "数据目录、忽略规则、日志级别、隐私模式。"
        status: planned
      - id: P07-W009
        name: "无障碍与主题基础"
        description: "键盘、缩放、深色、错误可读。"
        status: planned
  - id: P08
    name: "Repository Manager 与远程导入"
    goal: "安全处理普通 Git/GitHub/Gitee 仓库导入和更新，不执行仓库代码。"
    dependencies:
      - P07
    exit_gate: "可克隆公开/授权仓库，安全 status/diff/ff-only pull；有修改或分叉时停止。"
    work_items:
      - id: P08-W001
        name: "封装 Git 进程执行"
        description: "参数数组、不拼 Shell 字符串；超时、取消、输出限制。"
        status: planned
      - id: P08-W002
        name: "仓库 URL 解析"
        description: "HTTPS/SSH/GitHub/Gitee/普通 Git；规范化但不泄露凭据。"
        status: planned
      - id: P08-W003
        name: "实现 Clone Plan"
        description: "目标目录、分支、深度、子模块、LFS；先验证后执行。"
        status: planned
      - id: P08-W004
        name: "实现安全 Clone"
        description: "空目录、路径限制、Hook 风险说明、进度。"
        status: planned
      - id: P08-W005
        name: "实现 Status/Diff/Log"
        description: "机器可读解析；处理重命名、二进制和子模块。"
        status: planned
      - id: P08-W006
        name: "实现 ff-only Pull"
        description: "dirty/diverged 时停止；不自动 merge/rebase/reset。"
        status: planned
      - id: P08-W007
        name: "凭据引用"
        description: "优先系统 Git/GCM/SSH；CacheHub 不读取明文密钥。"
        status: planned
      - id: P08-W008
        name: "远程导入 GUI"
        description: "URL、计划、进度、失败恢复。"
        status: planned
      - id: P08-W009
        name: "Git 安全测试"
        description: "恶意 URL、参数注入、巨大输出、符号链接、非空目录。"
        status: planned
  - id: P09
    name: "通用项目检测与初始化计划"
    goal: "只读识别语言、框架、构建系统、Monorepo 和缺失工具，并生成计划而非自动执行。"
    dependencies:
      - P08
    exit_gate: "未知项目可降级；多组件可识别；检测不运行任何仓库脚本。"
    work_items:
      - id: P09-W001
        name: "定义 Detector 契约"
        description: "证据、置信度、组件路径、建议动作和风险。"
        status: planned
      - id: P09-W002
        name: "实现通用语言统计"
