schema_version: 2
items:
  -
    id: R4-W001
    phase: R4
    title: 建立可组合召回源接口
    objective: 将路径、FTS、符号、Git Diff、关系、Repo Map 拆成可测试的 IRecallSource；统一输出 RecallHit、ScoreHint、LineAnchor 和 Evidence。
    depends_on:

    status: planned
    execution_order: 1
    required_actions:
      - 读取相关现有代码、测试、协议和数据库结构，记录当前行为。
      - 先新增或更新能复现缺口的测试，确认修复前失败或不足。
      - 使用最小变更完成实现，禁止顺带重构无关模块。
      - 运行目标单元测试、相关集成测试和完整测试集。
      - 更新 Capability、README、AI_DEV_STATE 和必要 ADR/SPEC。
      - 独立提交 Git，并记录 commit SHA 与验证证据。
    required_evidence:
      - baseline_build
      - baseline_tests
      - changed_files
      - new_or_updated_tests
      - final_build
      - final_tests
      - security_or_performance_notes
      - commit_sha
    forbidden:
      - 使用模拟成功替代真实主链
      - 删除测试或降低断言以通过
      - 跨阶段混入无关功能
      - 未更新状态就宣称完成
    acceptance:
      - CLI 和 Local API 对同一输入返回相同的候选集合、排序和 Manifest。
      - 模糊任务不依赖显式文件路径，也能通过 FTS 或符号命中目标文件。
      - SelectedFile.Reasons 可追踪到实际数据库证据。
      - FTS、符号、关系任一模块关闭时能够明确降级，不得静默伪装为成功。
