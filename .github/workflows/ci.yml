name: CI

on:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore AI_KV.sln

      - name: Build
        run: dotnet build AI_KV.sln -c Release --no-restore

      - name: Test
        run: dotnet test AI_KV.sln -c Release --no-build --verbosity normal

      - name: Format check
        run: dotnet format AI_KV.sln --verify-no-changes --no-restore
