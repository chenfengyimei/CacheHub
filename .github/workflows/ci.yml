name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore CacheHub.sln

      - name: Build
        run: dotnet build CacheHub.sln -c Release --no-restore

      - name: Test
        run: dotnet test CacheHub.sln -c Release --no-build --verbosity normal

      - name: Format check
        run: dotnet format CacheHub.sln --verify-no-changes --no-restore
