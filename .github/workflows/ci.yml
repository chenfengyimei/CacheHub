name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore CacheHub.sln

      - name: Build
        run: dotnet build CacheHub.sln -c Release --no-restore

      - name: Test
        run: dotnet test CacheHub.sln -c Release --no-build --verbosity normal

      - name: Format check
        run: dotnet format CacheHub.sln --verify-no-changes --no-restore
